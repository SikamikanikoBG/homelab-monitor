services:
  homelab-monitor:
    build: .
    # MONITOR_IMAGE lets the self-update helper pin an exact image (the versioned tag for the upgrade, the previous digest for rollback); default is identical to before for a normal `docker compose up`.
    image: ${MONITOR_IMAGE:-sikamikaniko123/homelab-monitor:latest}
    container_name: homelab-monitor
    restart: unless-stopped
    # host networking lets it reach any model server's API (Ollama/vLLM/TGI/…)
    # and bind the dashboard directly on the host; pid:host maps GPU PIDs->containers.
    network_mode: host
    pid: host
    # Share the host's cgroup namespace so /proc/<pid>/cgroup shows real host
    # paths (e.g. /system.slice/pihole.service). Without it the container gets a
    # private cgroup namespace where those paths are virtualised (0::/../../…),
    # so the Services tab can't attribute a forking service's listening port to
    # the child PID that actually owns it (Pi-hole FTL, dnsmasq, libvirtd → :53).
    cgroup: host
    # SYS_PTRACE lets us resolve /proc/<pid>/fd/* symlinks for processes we
    # don't own, which is what powers the Services tab's Ports column (we
    # join /proc/net/tcp listen-inodes back to MainPID). Common in monitoring
    # stacks; the container is already otherwise host-privileged.
    cap_add:
      - SYS_PTRACE
    # Docker's default AppArmor profile (`docker-default`) denies ptrace
    # access even when CAP_SYS_PTRACE is granted, blocking the readlink()s
    # above. Opting this container out of AppArmor lets the cap actually
    # take effect.
    security_opt:
      - apparmor=unconfined
    environment:
      # GPU is auto-detected, never required. These env vars let the NVIDIA
      # container runtime inject nvidia-smi *when it's present*; on a host with no
      # GPU (or no nvidia runtime) they're simply inert and the dashboard runs
      # without the GPU panels. This is why there's no hard `deploy.devices`
      # reservation below — that would refuse to start on a GPU-less host.
      #
      # IMPORTANT: these env vars only take effect when nvidia is Docker's
      # *default* runtime. On stock Ubuntu/Debian/Mint the default is `runc`, so
      # GPU containers normally opt in per-container with `--gpus all` — this one
      # doesn't, so on those hosts the GPU goes undetected until you do ONE of:
      #
      #   A) Don't change the global default — bring it up with the GPU override:
      #        docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
      #
      #   B) Make nvidia the default runtime, then RECREATE this container
      #      (a plain restart keeps the old runtime, so the change "does nothing"):
      #        sudo nvidia-ctk runtime configure --runtime=docker --set-as-default
      #        sudo systemctl restart docker
      #        docker compose up -d --force-recreate
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: utility   # injects nvidia-smi into the container
      PORT: "9800"                          # dashboard served on 0.0.0.0:9800 (LAN/VPN reachable)
      MCP_PORT: "9810"                       # built-in read-only MCP server on 0.0.0.0:9810/mcp
      # ENABLE_MCP: "0"                      # uncomment to run the dashboard without the MCP server
      # MCP_ALLOWED_HOSTS: "YOUR-HUB:9810"  # lock the MCP HTTP transport to specific Host headers
                                            # (host:* wildcards ok). Unset = reachable from anywhere
                                            # on your homelab (default; safe — MCP tools are read-only).
      SAMPLE_INTERVAL: "10"                 # seconds between samples
      RETENTION_DAYS: "180"                 # how long history is kept
      PRESSURE_FREE_MB: "2048"              # free VRAM below this counts as "pressure"
      HOST_ROOT: "/rootfs"                  # where host / is mounted (for disk stats)
      # Tell jeepney where the host's systemd D-Bus socket is (mounted below).
      DBUS_SYSTEM_BUS_ADDRESS: "unix:path=/run/dbus/system_bus_socket"
      # WATCH_CONTAINERS: "ollama,immich_machine_learning"  # extra containers to scan for OOM
      # WATCH_SERVICES: "tailscaled,sshd"   # always show these systemd units, even if vendor-shipped
      # ALLOW_SELF_UPDATE is set by docker-compose.self-update.yml — use that override to enable the one-click update button
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro   # container health, names & model APIs
      - /:/rootfs:ro                                    # read-only host fs for disk usage
      - ./data:/data                                    # SQLite history persists here
      # systemd service health (optional): expose the host's D-Bus system socket
      # read-only. Remove this line and the Services panel just shows "unavailable".
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket:ro
    # NOTE: intentionally no `deploy.resources.reservations.devices: nvidia` here.
    # A hard GPU reservation makes `docker compose up` fail on any host without the
    # NVIDIA runtime — the monitor is useful without a GPU, so we let it start
    # everywhere and auto-use the GPU via the NVIDIA_* env vars above when present.
    #
    # The read-only MCP server is built into this same image and served on
    # $MCP_PORT (9810) — host networking above already exposes it. Connect with:
    #   claude mcp add --transport http homelab http://YOUR-HUB:9810/mcp
    # See https://sikamikanikobg.github.io/homelab-monitor/mcp/.
