name: Announce release on Discord

# On a published, NON-prerelease, MINOR-or-greater release, post the changelog
# as a rich embed to the project Discord #announcements channel via webhook.
#
# Patch releases (vX.Y.Z, Z>0) and prereleases are skipped on purpose: patches
# ship daily and silently (Docker rebuild only, no announcement) — announcing
# every one would spam the channel. Bigger versions (vX.Y.0) are the moments
# worth communicating, and they roll up all the patches since. This mirrors the
# selfh.st announcer's gate so both channels speak only on minor+ versions.
# Re-post a specific tag by hand via the "Run workflow" button (workflow_dispatch).
#
#   secrets.DISCORD_ANNOUNCE_WEBHOOK   Discord webhook URL for #announcements
#
# ── DISABLED 2026-06-21 ───────────────────────────────────────────────────────
# A community-run GitHub→Discord bot (repo webhook) already posts every repo
# event — releases, PRs, issues, stars — into the channel, so this workflow's
# release announcement would be a DUPLICATE. The auto-trigger is commented out
# below; the file is kept (not deleted) and can still be run by hand via
# workflow_dispatch, or fully re-enabled by uncommenting the `release:` trigger
# if the external bot ever goes away.

on:
  # release:                 # ← disabled: external GitHub→Discord bot covers this
  #   types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to (re)post, e.g. v0.14.3'
        required: true

permissions:
  contents: read

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release
        id: rel
        uses: actions/github-script@v9
        with:
          script: |
            let r;
            if (context.eventName === 'workflow_dispatch') {
              r = (await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner, repo: context.repo.repo,
                tag: context.payload.inputs.tag,
              })).data;
            } else {
              r = context.payload.release;
            }
            core.setOutput('tag', r.tag_name);
            core.setOutput('name', r.name || r.tag_name);
            core.setOutput('url', r.html_url);
            core.setOutput('prerelease', String(r.prerelease));
            core.setOutput('body', r.body || '');

      - name: Gate (skip prereleases and patch releases)
        id: gate
        env:
          PRERELEASE: ${{ steps.rel.outputs.prerelease }}
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          ver="${TAG#v}"
          IFS='.' read -r major minor patch _ <<< "$ver"
          if [ "$PRERELEASE" = "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "::notice::$TAG is a prerelease — skipping"; exit 0
          fi
          if [ "${patch:-0}" != "0" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "::notice::$TAG is a patch release — skipping (patches ship silently)"; exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "::notice::$TAG qualifies — announcing on Discord"

      - name: Post to Discord
        if: steps.gate.outputs.skip == 'false'
        env:
          WEBHOOK: ${{ secrets.DISCORD_ANNOUNCE_WEBHOOK }}
          NAME: ${{ steps.rel.outputs.name }}
          URL: ${{ steps.rel.outputs.url }}
          BODY: ${{ steps.rel.outputs.body }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::error::DISCORD_ANNOUNCE_WEBHOOK not set"; exit 1
          fi
          # Tidy GitHub markdown for Discord: ATX headings -> bold, drop the
          # auto-generated "Full Changelog" compare line.
          desc=$(printf '%s' "$BODY" \
            | sed -E 's/^#{1,6}[[:space:]]+(.*)$/**\1**/' \
            | sed -E '/^\*\*Full Changelog\*\*/d; /^Full Changelog/d')
          # Discord embed description hard limit is 4096 chars; keep headroom
          # and link out to the full notes when we truncate.
          if [ "$(printf '%s' "$desc" | wc -c)" -gt 3500 ]; then
            head=$(printf '%s' "$desc" | cut -c1-3500)
            desc=$(printf '%s\n\n… [read the full release notes →](%s)' "$head" "$URL")
          fi
          payload=$(jq -nc \
            --arg name "$NAME" --arg url "$URL" --arg desc "$desc" \
            '{
              username: "homelab-monitor",
              embeds: [{
                title: $name,
                url: $url,
                description: $desc,
                color: 5793266,
                footer: { text: "homelab-monitor • new release" }
              }]
            }')
          code=$(curl -sS -o /tmp/resp.txt -w '%{http_code}' \
            -H 'Content-Type: application/json' -d "$payload" "$WEBHOOK?wait=true")
          echo "HTTP $code"; cat /tmp/resp.txt || true
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::error::Discord post failed (HTTP $code)"; exit 1
          fi
