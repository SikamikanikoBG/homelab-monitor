name: Update star history chart

# GitHub restricted the stargazers endpoint on 2026-06-30 to a repository's own
# admins and collaborators. star-history.com's servers are neither, so the chart
# we used to embed now returns a 200 whose whole content is the sentence "GitHub
# restricted access to star data".
#
# Their workaround is to put a token in the README so their servers can read the
# repo as us — and the token they ask for needs `Contents: read and write`, i.e.
# a third party holding a credential that can push to this repository. No.
#
# We are the repo's owner, so we can read our own stargazers: this renders the
# chart here, commits two SVGs, and the README points at those. No third party,
# no token to leak, and it survives whatever star-history.com does next.
#
# The SVGs live on an orphan `star-history` branch, not on main: main is
# protected (PR-only, required checks), so a bot push there is rejected with
# GH006 — which is why this workflow failed on every run from 2026-09-30 (#319).
# Same pattern as stats.yml and its `stats` branch.

on:
  schedule:
    - cron: '41 5 * * *'        # daily at 05:41 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/star-history.yml'
      - 'scripts/star_history.py'

permissions:
  contents: write

concurrency:
  group: star-history
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Render the chart
        env:
          # GITHUB_TOKEN: since 2026-06-30 the stargazers endpoint only accepts a
          # token belonging to an admin or collaborator on the repo, and
          # GITHUB_TOKEN acts as the repository itself, so it always qualifies.
          # (The previous STATS_PAT was a fine-grained PAT that GitHub rejected
          # with a 403 "not accessible by personal access token" — that is why
          # the chart went stale on 2026-08-09.)
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/star_history.py --out-dir "$RUNNER_TEMP/chart"

      - name: Publish to the star-history branch if the chart moved
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch origin star-history:star-history 2>/dev/null; then
            git checkout star-history
          else
            git checkout --orphan star-history
            git rm -rf . >/dev/null 2>&1 || true
          fi
          cp "$RUNNER_TEMP"/chart/star-history-*.svg .
          git add star-history-light.svg star-history-dark.svg
          if git diff --cached --quiet; then
            echo "no change — nobody starred since the last run"
            exit 0
          fi
          git commit -m "chore(readme): refresh the star-history chart"
          git push origin star-history
