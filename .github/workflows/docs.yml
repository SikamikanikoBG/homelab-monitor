name: Build &amp; deploy docs site

# Builds the MkDocs Material site under website/ and publishes it to GitHub
# Pages. Triggers:
#   • Push to main that touches site sources (website/, mkdocs.yml, docs media,
#     this workflow) — incremental updates between releases.
#   • Any v* tag push — keeps the site in lock-step with the Docker Hub image
#     publish (see release.yml), so each release lands on Hub + on the site
#     together. Tag pushes ignore the paths filter; a tag is always "ship it".
#   • Manual workflow_dispatch.
# Mirrors the existing docs/*.png/*.gif/*.svg into website/screenshots/ at
# build time so there's a single source of truth.

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'mkdocs.yml'
      - 'docs/*.png'
      - 'docs/*.gif'
      - 'docs/*.svg'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pages deploys serialise — cancel an in-flight one if a new push lands.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install mkdocs-material
        run: pip install --quiet mkdocs-material==9.5.39

      - name: Mirror screenshots into the site
        # We keep docs/ as the canonical home of the README's PNGs, the demo
        # GIF and the architecture SVG, but the site needs them under its own
        # docs_dir. Copy at build time so there's a single source of truth.
        run: |
          mkdir -p website/screenshots
          cp docs/*.png website/screenshots/ 2>/dev/null || true
          cp docs/*.gif website/screenshots/ 2>/dev/null || true
          cp docs/*.svg website/screenshots/ 2>/dev/null || true

      - name: Build
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
