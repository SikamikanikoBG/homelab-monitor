name: CI

# Lightweight smoke for the integration branch. The release / docs / Hub-sync
# workflows are deliberately scoped to `main` + `v*` tags; this one guards the
# day-to-day flow so `next` never accumulates code that won't even build.
#
# Triggers:
#   • Pull requests targeting `next` (the integration branch) or `main`.
#   • Pushes to `next` — a belt-and-braces check after merges land.
# Intentionally NOT on every main push — release-validate.yml owns that
# trigger (it re-runs the full suite, not just this subset, before tagging).
#
# On a push to `next`, once `smoke` is green, `publish-next` ships a moving
# `:next` Docker image (the preview channel) so a Watchtower-followed staging
# instance can auto-redeploy. See deploy/docker-compose.next.yml.

on:
  pull_request:
    branches: [next, main]
  push:
    branches: [next]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── snapshot gate ─────────────────────────────────────────────────────────────
  # Required on every PR. Runs the deterministic endpoint snapshot suite
  # (Phase 0.1 of the refactor plan). A failing snapshot means a refactor PR
  # changed observable API behavior — either fix the regression or explicitly
  # rebaseline with UPDATE_SNAPSHOTS=1.
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run snapshot tests (determinism check)
        run: python -m pytest tests/test_snapshots.py -v --tb=short

      - name: Verify snapshots are byte-identical on second run
        run: python -m pytest tests/test_snapshots.py -q

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Byte-compile the app
        run: python -m py_compile app.py probe.py

      # Structural guards on the dashboard's refresh loop. Pure stdlib (re +
      # pathlib over static/dashboard.html), so pytest is the only dependency —
      # the snapshot job's flask/prometheus stack isn't needed here.
      - name: Install pytest
        run: pip install pytest

      - name: Dashboard refresh-loop invariants
        run: python -m pytest tests/test_dashboard_refresh_invariants.py -q

      # The dashboard is one HTML file with no build step, so there is no npm
      # project here and nothing to install: this lifts the refresh-loop and
      # live-tail functions straight out of static/dashboard.html and runs them
      # against a fake clock on the runner's preinstalled Node.
      - name: Dashboard refresh-loop behaviour
        run: node tests/js/test_refresh_loop.js

      # Locale changes hydrate static markup and then re-render whichever
      # JavaScript-built view is active. Lift that listener from the shipped
      # dashboard and cover every tab branch without needing a browser build.
      - name: Dashboard locale re-render behaviour
        run: node tests/js/test_locale_rerender.js

      # Same lift-and-run technique, for the AI Models tab's TFLOPS arithmetic.
      # The live fleet can't cover it: the hub has one card and one fully-
      # resident model, so the multi-card and RAM-spill branches only ever get
      # exercised here.
      - name: Dashboard TFLOPS cells
        run: node tests/js/test_tflops_cells.js

      - name: Build the image
        run: docker build -t homelab-monitor:ci .

      - name: Boot it and hit /healthz
        run: |
          # /data is a compose volume in real deploys; for a bare run point the
          # SQLite DB + SSH dir at writable paths so the app can boot headless.
          docker run -d --name hlm -e PORT=9800 -e DB_PATH=/tmp/gpu.db -e SSH_DIR=/tmp/.ssh -p 9800:9800 homelab-monitor:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9800/healthz >/dev/null; then
              echo "healthz OK after ${i}s"; docker rm -f hlm; exit 0
            fi
            sleep 1
          done
          echo "healthz never came up"; docker logs hlm; docker rm -f hlm; exit 1

  # ── preview channel ───────────────────────────────────────────────────────────
  # After smoke passes on a push to `next`, publish a moving `:next` image (plus an
  # immutable `:next-<sha>` for pinning / rollback) to Docker Hub. This is the dev
  # preview channel, kept separate from the released `:latest` / `:x.y.z` tags that
  # release.yml publishes on `v*` tags. A Watchtower-followed staging instance on
  # the hub (deploy/docker-compose.next.yml) redeploys whenever `:next` moves.
  publish-next:
    needs: [snapshot, smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/next'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: sikamikaniko123/homelab-monitor
          tags: |
            type=raw,value=next
            type=sha,prefix=next-,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          # amd64-only keeps the per-merge build fast; the deploy target (ardi) is
          # x86_64. Add linux/arm64 here (and setup-qemu-action above) if you ever
          # run `:next` on an arm host.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
