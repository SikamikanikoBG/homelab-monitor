name: CI

# Lightweight smoke for the integration branch. The release / docs / Hub-sync
# workflows are deliberately scoped to `main` + `v*` tags; this one guards the
# day-to-day flow so `next` never accumulates code that won't even build.
#
# Triggers:
#   • Pull requests targeting `next` (the integration branch) or `main`.
#   • Pushes to `next` — a belt-and-braces check after merges land.
# Intentionally NOT on every main push (tags/main already gate releases).
#
# On a push to `next`, once `smoke` is green, `publish-next` ships a moving
# `:next` Docker image (the preview channel) so a Watchtower-followed staging
# instance can auto-redeploy. See deploy/docker-compose.next.yml.

on:
  pull_request:
    branches: [next, main]
  push:
    branches: [next, next_ai]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Byte-compile the app
        run: python -m py_compile app.py probe.py

      - name: Build the image
        run: docker build -t homelab-monitor:ci .

      - name: Boot it and hit /healthz
        run: |
          # /data is a compose volume in real deploys; for a bare run point the
          # SQLite DB + SSH dir at writable paths so the app can boot headless.
          docker run -d --name hlm -e PORT=9800 -e DB_PATH=/tmp/gpu.db -e SSH_DIR=/tmp/.ssh -p 9800:9800 homelab-monitor:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9800/healthz >/dev/null; then
              echo "healthz OK after ${i}s"; docker rm -f hlm; exit 0
            fi
            sleep 1
          done
          echo "healthz never came up"; docker logs hlm; docker rm -f hlm; exit 1

  # ── preview channel ───────────────────────────────────────────────────────────
  # After smoke passes on a push to `next`, publish a moving `:next` image (plus an
  # immutable `:next-<sha>` for pinning / rollback) to Docker Hub. This is the dev
  # preview channel, kept separate from the released `:latest` / `:x.y.z` tags that
  # release.yml publishes on `v*` tags. A Watchtower-followed staging instance on
  # the hub (deploy/docker-compose.next.yml) redeploys whenever `:next` moves.
  publish-next:
    needs: smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/next'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: sikamikaniko123/homelab-monitor
          tags: |
            type=raw,value=next
            type=sha,prefix=next-,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          # amd64-only keeps the per-merge build fast; the deploy target (ardi) is
          # x86_64. Add linux/arm64 here (and setup-qemu-action above) if you ever
          # run `:next` on an arm host.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 🤖 AI ARENA channel ───────────────────────────────────────────────────────
  # Mirror of publish-next for the human-vs-AI build-off (ends 2026-07-15). After
  # smoke passes on a push to `next_ai` (Claude's competition branch), publish a
  # moving `:next_ai` image (plus an immutable `:next_ai-<sha>` for pinning) to
  # Docker Hub. The global label-enabled Watchtower on ardi redeploys the
  # homelab-monitor-next-ai container (ardi:9802) whenever `:next_ai` moves.
  # See deploy/docker-compose.next-ai.yml.
  publish-next-ai:
    needs: smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/next_ai'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: sikamikaniko123/homelab-monitor
          tags: |
            type=raw,value=next_ai
            type=sha,prefix=next_ai-,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
