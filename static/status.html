<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lab status · HomeLab Monitor</title>
<meta name="description" content="Public read-only health of the lab.">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark light">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="alternate icon" href="/favicon.ico">
<link rel="alternate" type="application/rss+xml" title="Lab status — incidents" href="/status/feed.xml">
<style>
/* ── Design tokens — mirrored from dashboard.html so the page is on-brand ── */
:root{--mono:ui-monospace,"JetBrains Mono","SF Mono","Cascadia Code",Menlo,Consolas,monospace}
:root,[data-theme="dark"]{--bg:#0d1117;--card:#161b22;--bd:#30363d;--tx:#e6edf3;--mut:#8b949e;--accent:#d29922;--free:#21262d;
--crit:#f85149;--warn:#d29922;--ok:#3fb950;--info:#58a6ff;
--canvas:#0a0e14;--inset:#0d1117;--hover:#161b22;--sel:#1c232e;--sb:#0b0f15;
--okbg:#3fb95018;--warnbg:#d2992218;--critbg:#f8514918;--okbd:#3fb95055;--warnbd:#d2992255;--critbd:#f8514955}
[data-theme="light"]{--bg:#ffffff;--card:#ffffff;--bd:#d0d7de;--tx:#1f2328;--mut:#636c76;--accent:#9a6700;--free:#eaeef2;
--crit:#cf222e;--warn:#9a6700;--ok:#1a7f37;--info:#0969da;
--canvas:#f6f8fa;--inset:#f6f8fa;--hover:#eef1f4;--sel:#e7ebf0;--sb:#f6f8fa;
--okbg:#1a7f3714;--warnbg:#9a670014;--critbg:#cf222e14;--okbd:#1a7f3755;--warnbd:#9a670055;--critbd:#cf222e55}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:
  radial-gradient(1200px 480px at 50% -10%, color-mix(in srgb,var(--accent) 9%, transparent), transparent 70%),
  var(--bg);
  color:var(--tx);font:15px/1.55 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;min-height:100vh}
a{color:var(--accent);text-decoration:none}
.wrap{max-width:880px;margin:0 auto;padding:26px 18px 64px}
/* header */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;letter-spacing:.2px}
.brand img{width:26px;height:26px;display:block}
.brand .sub{color:var(--mut);font-weight:500}
.top .spacer{flex:1}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border:1px solid var(--bd);
  border-radius:9px;background:var(--card);color:var(--mut);cursor:pointer;transition:border-color .15s,color .15s,transform .12s}
.iconbtn:hover{border-color:var(--accent);color:var(--accent)}
.iconbtn:active{transform:scale(.94)}
.iconbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.linkbtn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border:1px solid var(--bd);border-radius:9px;
  background:var(--card);color:var(--tx);font-size:13px;font-weight:600;transition:border-color .15s,color .15s}
.linkbtn:hover{border-color:var(--accent);color:var(--accent)}
.demo-pill{display:none;align-items:center;gap:6px;height:24px;padding:0 9px;border:1px solid var(--accent);border-radius:999px;
  background:var(--warnbg);color:var(--accent);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
body.demo .demo-pill{display:inline-flex}
/* hero banner */
.hero{margin:26px 0 6px;border:1px solid var(--bd);border-radius:18px;background:var(--card);position:relative;overflow:hidden;
  padding:30px 28px;display:flex;align-items:center;gap:22px;box-shadow:0 1px 2px #0000000f}
.hero::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--mut)}
.hero.ok::before{background:var(--ok)}.hero.degraded::before{background:var(--warn)}.hero.down::before{background:var(--crit)}
.hero .orb{flex:none;width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative}
.hero .orb .core{width:18px;height:18px;border-radius:50%;background:var(--mut);position:relative;z-index:2}
.hero.ok .orb .core{background:var(--ok)}.hero.degraded .orb .core{background:var(--warn)}.hero.down .orb .core{background:var(--crit)}
.hero .orb .ring{position:absolute;inset:0;border-radius:50%;background:currentColor;opacity:.18;animation:pulse 2.4s ease-out infinite}
.hero.ok .orb{color:var(--ok)}.hero.degraded .orb{color:var(--warn)}.hero.down .orb{color:var(--crit)}
@keyframes pulse{0%{transform:scale(.4);opacity:.42}80%,100%{transform:scale(1);opacity:0}}
.hero .htxt{min-width:0}
.hero h1{margin:0;font-size:23px;font-weight:700;letter-spacing:-.2px}
.hero .hsub{margin-top:4px;color:var(--mut);font-size:13.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hero .dot{width:7px;height:7px;border-radius:50%;background:var(--mut);display:inline-block}
.hero .dot.ok{background:var(--ok)}.hero .dot.warn{background:var(--warn)}.hero .dot.crit{background:var(--crit)}
/* KPI strip */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}
.kpi{border:1px solid var(--bd);border-radius:14px;background:var(--card);padding:15px 16px}
.kpi .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .v small{font-size:14px;color:var(--mut);font-weight:600}
.kpi .l{margin-top:4px;color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.kpi.busy .v{color:var(--ok)}.kpi.idle .v{color:var(--mut)}
.kpi.bad .v{color:var(--crit)}
/* tiles */
.sect{margin:24px 0 10px;color:var(--mut);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.tile{border:1px solid var(--bd);border-radius:14px;background:var(--card);padding:15px 16px;position:relative;overflow:hidden;
  transition:border-color .15s,transform .12s}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--mut)}
.tile.ok::before{background:var(--ok)}.tile.warn::before{background:var(--warn)}.tile.crit::before{background:var(--crit)}.tile.info::before{background:var(--bd)}
.tile:hover{border-color:var(--mut);transform:translateY(-1px)}
.tile .th{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tile .tname{font-weight:700;font-size:14.5px}
.tile .badge{font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;border:1px solid var(--bd);white-space:nowrap}
.tile .badge.ok{color:var(--ok);border-color:var(--okbd);background:var(--okbg)}
.tile .badge.warn{color:var(--warn);border-color:var(--warnbd);background:var(--warnbg)}
.tile .badge.crit{color:var(--crit);border-color:var(--critbd);background:var(--critbg)}
.tile .badge.info{color:var(--mut)}
.tile .tdetail{margin-top:9px;color:var(--mut);font-size:13px;font-variant-numeric:tabular-nums}
.tile .tdetail b{color:var(--tx);font-weight:700}
/* heartbeat bars (Uptime-Kuma-style strip) */
.hb{margin-top:11px}
.hb .bar{display:flex;gap:2px;align-items:flex-end;height:26px}
.hb .cell{flex:1 1 0;min-width:0;height:100%;border-radius:2px;background:var(--bd);transition:transform .12s}
.hb .cell.ok{background:var(--ok)}
.hb .cell.warn{background:var(--warn)}
.hb .cell.crit{background:var(--crit)}
.hb .cell.nodata{background:var(--bd);opacity:.45}
.hb .cell:hover{transform:scaleY(1.12)}
.hb .hbsum{margin-top:7px;display:flex;justify-content:space-between;gap:8px;color:var(--mut);font-size:11.5px;font-variant-numeric:tabular-nums}
.hb .hbsum b{color:var(--tx);font-weight:700}
.hb .hbsum.collecting{color:var(--mut);font-style:italic}
@media(prefers-reduced-motion:reduce){ .hb .cell{transition:none} .hb .cell:hover{transform:none} }
/* 90-day uptime ribbon (StatusPage.io-style daily cells) */
.ribbon{margin:0 0 22px}
.ribbon .rbhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:9px;flex-wrap:wrap}
.ribbon .rbpct{font-size:15px;font-weight:700;color:var(--tx);font-variant-numeric:tabular-nums}
.ribbon .rbpct small{font-weight:600;color:var(--mut);font-size:12px}
.ribbon .rbnote{color:var(--mut);font-size:12px;font-style:italic}
.ribbon .rbbar{display:flex;gap:2px;align-items:stretch;height:34px;overflow-x:auto;scrollbar-width:thin}
.ribbon .day{flex:1 0 4px;min-width:4px;border-radius:2px;background:var(--bd);transition:transform .12s}
.ribbon .day.ok{background:var(--ok)}
.ribbon .day.warn{background:var(--warn)}
.ribbon .day.crit{background:var(--crit)}
.ribbon .day.nodata{background:var(--bd);opacity:.4}
.ribbon .day:hover{transform:scaleY(1.08)}
.ribbon .rbaxis{display:flex;justify-content:space-between;margin-top:6px;color:var(--mut);font-size:11px}
@media(max-width:520px){ .ribbon .day{flex:0 0 5px} .ribbon .rbbar{height:30px} }
@media(prefers-reduced-motion:reduce){ .ribbon .day{transition:none} .ribbon .day:hover{transform:none} }
/* ── Monitors (per-service rows, opt-in) + per-service detail page ── */
.mons{display:flex;flex-direction:column;gap:10px}
.mon{display:block;border:1px solid var(--bd);border-radius:14px;background:var(--card);padding:14px 16px;
  position:relative;overflow:hidden;transition:border-color .15s,transform .12s;color:inherit}
.mon::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--mut)}
.mon.up::before{background:var(--ok)}.mon.down::before{background:var(--crit)}.mon.unknown::before{background:var(--bd)}
a.mon:hover{border-color:var(--mut);transform:translateY(-1px)}
a.mon:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mon .mhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.mon .mname{font-weight:700;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mon .mname .mhost{display:block;color:var(--mut);font-size:12px;font-weight:500;font-family:var(--mono);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mon .mright{display:flex;align-items:center;gap:10px;flex:none}
.mon .mpct{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--tx)}
.badge{font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;border:1px solid var(--bd);white-space:nowrap}
.badge.up,.badge.ok{color:var(--ok);border-color:var(--okbd);background:var(--okbg)}
.badge.down,.badge.crit{color:var(--crit);border-color:var(--critbd);background:var(--critbg)}
.badge.unknown,.badge.info{color:var(--mut)}
.mon .chev{color:var(--mut);flex:none}
/* compact 90-day daily bar reused inside a monitor row + the detail page */
.dbar{display:flex;gap:2px;align-items:stretch;height:26px;margin-top:11px;overflow:hidden}
.dbar .day{flex:1 0 0;min-width:0;border-radius:2px;background:var(--bd);transition:transform .12s}
.dbar .day.ok{background:var(--ok)}.dbar .day.warn{background:var(--warn)}.dbar .day.crit{background:var(--crit)}
.dbar .day.nodata{background:var(--bd);opacity:.4}
.dbar .day:hover{transform:scaleY(1.1)}
@media(prefers-reduced-motion:reduce){ .dbar .day{transition:none} .dbar .day:hover{transform:none} }
/* back link + detail header */
.back{display:inline-flex;align-items:center;gap:6px;color:var(--mut);font-size:13px;font-weight:600;margin:18px 0 2px}
.back:hover{color:var(--accent)}
.dwins{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:6px 0 4px}
.dwin{border:1px solid var(--bd);border-radius:14px;background:var(--card);padding:14px 16px;text-align:left}
.dwin .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.dwin .v.na{color:var(--mut)}
.dwin .l{margin-top:4px;color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.5px;font-weight:600}
@media(max-width:520px){ .dwins{grid-template-columns:repeat(2,1fr)} }
/* SLA / downtime summary + RSS subscribe link */
.slahead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.rsslink{display:inline-flex;align-items:center;gap:6px;color:var(--mut);font-size:12px;font-weight:600;text-transform:none;letter-spacing:0}
.rsslink:hover{color:var(--accent)}
.rsslink svg{opacity:.85}
.sla{border:1px solid var(--bd);border-radius:14px;background:var(--card);overflow:hidden}
.slarow{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:12px 16px;border-top:1px solid var(--bd);font-variant-numeric:tabular-nums}
.slarow:first-child{border-top:0}
.slarow .sll{color:var(--mut);font-size:13px;font-weight:600}
.slarow .slr{font-size:13px;color:var(--tx)}
.slarow .slr b{font-weight:700}
.slarow .slr .sldn,.slarow .slr .slic{color:var(--mut);font-weight:500}
.slarow .slr .na{color:var(--mut)}
.card{border:1px solid var(--bd);border-radius:14px;background:var(--card);padding:16px}
.spark{width:100%;height:72px;display:block;overflow:visible}
.spark .ln{fill:none;stroke:var(--info);stroke-width:1.6;vector-effect:non-scaling-stroke}
.spark .ar{fill:var(--info);opacity:.10}
.sparknote{color:var(--mut);font-size:12px;font-style:italic;padding:18px 0;text-align:center}
/* incident feed */
.inc{display:flex;flex-direction:column;gap:0}
.inc .day{padding:12px 0;border-top:1px solid var(--bd)}
.inc .day:first-child{border-top:0}
.inc .dlabel{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.inc .row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:5px 0;flex-wrap:wrap}
.inc .rl{display:flex;align-items:baseline;gap:8px;min-width:0}
.inc .dot{width:7px;height:7px;border-radius:50%;background:var(--crit);flex:none;align-self:center}
.inc .dot.ongoing{box-shadow:0 0 0 3px var(--critbg)}
.inc .reason{font-weight:600;font-size:14px}
.inc .when{color:var(--mut);font-size:12.5px;font-variant-numeric:tabular-nums}
.inc .dur{color:var(--mut);font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.inc .code{font-family:var(--mono);font-size:11px;color:var(--mut);border:1px solid var(--bd);border-radius:5px;padding:0 5px;margin-left:6px}
.inc .ongo{color:var(--crit);font-weight:700}
.empty{color:var(--mut);font-size:13px;font-style:italic;padding:16px 0;text-align:center}
[hidden]{display:none!important}
/* footer */
.foot{margin-top:30px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;color:var(--mut);font-size:12.5px}
.foot .spacer{flex:1}
.foot .auto{display:inline-flex;align-items:center;gap:6px}
.foot .auto .ld{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.skel{position:relative;overflow:hidden;color:transparent!important;border-radius:8px}
.skel::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,var(--hover),transparent);
  background-size:200% 100%;animation:sh 1.3s infinite}
@keyframes sh{to{background-position:-200% 0}}
.offline{display:none;margin:18px 0;padding:11px 14px;border:1px solid var(--critbd);background:var(--critbg);color:var(--crit);
  border-radius:11px;font-size:13.5px;font-weight:600}
body.offline-state .offline{display:block}
/* responsive */
@media(max-width:640px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .hero{padding:24px 20px;gap:16px}
  .hero .orb{width:54px;height:54px}.hero h1{font-size:20px}
  .brand .sub{display:none}
}
@media(prefers-reduced-motion:reduce){
  .hero .orb .ring,.foot .auto .ld,.skel::after{animation:none!important}
  .tile,.iconbtn{transition:none}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="brand" href="/" data-i18n-aria="status.dashboard" aria-label="Open dashboard">
      <img src="/static/logo.svg" alt="">
      <span>HomeLab Monitor</span><span class="sub" data-i18n="status.title">Lab status</span>
    </a>
    <span class="demo-pill" data-i18n="status.demo" title="Demo data">Demo data</span>
    <span class="spacer"></span>
    <a class="linkbtn" href="/" data-i18n="status.dashboard" data-i18n-title="status.dashboard">Open dashboard</a>
    <button class="iconbtn" id="themeBtn" type="button" data-i18n-aria="status.theme" data-i18n-title="status.theme" aria-label="Toggle theme">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path id="themeIcon" d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
    </button>
  </div>

  <div class="offline" role="alert" data-i18n="status.offline">Status unavailable — retrying…</div>

  <!-- ── INDEX VIEW ── -->
  <div id="indexView">
    <section class="hero" id="hero" aria-live="polite">
      <div class="orb"><span class="ring"></span><span class="core"></span></div>
      <div class="htxt">
        <h1 id="bannerText" class="skel">All systems operational</h1>
        <div class="hsub" id="bannerSub"><span class="skel">Last updated just now</span></div>
      </div>
    </section>

    <div class="kpis" id="kpis" aria-label="Headline stats"></div>

    <div class="ribbon" id="ribbon" hidden></div>

    <div class="sect" data-i18n="status.title">Lab status</div>
    <div class="tiles" id="tiles"></div>

    <div id="monsSect" hidden>
      <div class="sect" data-i18n="status.monitors">Monitors</div>
      <div class="mons" id="mons"></div>
    </div>

    <div id="incSect" hidden>
      <div class="sect" data-i18n="status.incidents">Past incidents</div>
      <div class="inc card" id="incFeed"></div>
    </div>
  </div>

  <!-- ── DETAIL VIEW (per-service) ── -->
  <div id="detailView" hidden>
    <a class="back" href="/status" id="backLink">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      <span data-i18n="status.detail.back">All monitors</span>
    </a>
    <section class="hero" id="dHero" aria-live="polite">
      <div class="orb"><span class="ring"></span><span class="core"></span></div>
      <div class="htxt">
        <h1 id="dName" class="skel">Service</h1>
        <div class="hsub" id="dSub"></div>
      </div>
    </section>
    <div class="dwins" id="dWins"></div>
    <div class="ribbon" id="dRibbon" hidden></div>
    <div class="sect slahead" id="dSlaHead"><span data-i18n="status.sla.title">SLA &amp; downtime</span><a class="rsslink" id="dRss" rel="alternate" hidden><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5.5" cy="18.5" r="2.3"/><path d="M3.5 10.2v3.1c4.2 0 7.6 3.4 7.6 7.6h3.1c0-5.9-4.8-10.7-10.7-10.7z"/><path d="M3.5 3.5v3.1c8 0 14.5 6.5 14.5 14.5h3.1C21.1 11.4 13.2 3.5 3.5 3.5z"/></svg><span data-i18n="status.rss">Subscribe (RSS)</span></a></div>
    <div class="sla" id="dSla"></div>
    <div class="sect" data-i18n="status.detail.latency">Response time</div>
    <div class="card"><div id="dSpark"></div></div>
    <div class="sect" data-i18n="status.incidents">Past incidents</div>
    <div class="inc card" id="dInc"></div>
  </div>

  <div class="foot">
    <span class="auto"><span class="ld"></span><span data-i18n="status.auto">Auto-refreshing</span></span>
    <span class="spacer"></span>
    <span><a href="/" data-i18n="status.powered">Powered by HomeLab Monitor</a></span>
  </div>
</div>

<script>
/* ── Minimal self-contained i18n (reuses dashboard's /locales/<code>.json) ── */
const I18N = {
  locale:'en', dict:{},
  t(k,f){ const v=this.dict[k]; return (v!=null&&v!=='')?v:(f!=null?f:k); },
  tf(k,f,vars){ let s=this.t(k,f); if(vars)for(const n in vars)s=s.split('{'+n+'}').join(vars[n]); return s; },
  async init(){
    const code = localStorage.getItem('hl_lang') || 'en';
    if(code && code!=='en'){
      try{ this.dict = await (await fetch('/locales/'+code+'.json',{cache:'no-cache'})).json(); this.locale=code; }
      catch(e){ this.dict={}; }
    }
    document.documentElement.lang = this.locale;
    document.documentElement.dir = (this.dict._meta&&this.dict._meta.dir) || 'ltr';
    this.hydrate();
  },
  hydrate(){
    document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent = this.t(el.getAttribute('data-i18n'), el.textContent); });
    document.querySelectorAll('[data-i18n-title]').forEach(el=>{ el.title = this.t(el.getAttribute('data-i18n-title')); });
    document.querySelectorAll('[data-i18n-aria]').forEach(el=>{ el.setAttribute('aria-label', this.t(el.getAttribute('data-i18n-aria'))); });
  }
};

/* ── Theme (system / dark / light), shared with the dashboard's hl_theme ── */
const THEMES=['system','dark','light'];
function applyTheme(t){
  if(t==='system'){
    const dark = matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', dark?'dark':'light');
  } else document.documentElement.setAttribute('data-theme', t);
}
let theme = localStorage.getItem('hl_theme') || 'system';
applyTheme(theme);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{ if(theme==='system') applyTheme('system'); });
document.getElementById('themeBtn').addEventListener('click',()=>{
  theme = THEMES[(THEMES.indexOf(theme)+1)%THEMES.length];
  localStorage.setItem('hl_theme', theme); applyTheme(theme);
});

/* ── Helpers ── */
function ago(sec){
  if(sec<5) return I18N.t('status.ago.now','just now');
  if(sec<60) return I18N.tf('status.ago.sec','{n}s ago',{n:sec});
  if(sec<3600) return I18N.tf('status.ago.min','{n}m ago',{n:Math.floor(sec/60)});
  return I18N.tf('status.ago.hour','{n}h ago',{n:Math.floor(sec/3600)});
}
const TILE_NAME={gpu:'status.tile.gpu',host:'status.tile.host',containers:'status.tile.containers',services:'status.tile.services'};

// Compact 90-day daily bar (cells colored by worst state that day).
function dailyBar(days){

    const s=(c.s==null?-1:c.s);

// Local-date label for an epoch (privacy-safe: derived from timestamp only).
function dateLabel(ts){ try{ return new Date(ts*1000).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}); }catch(e){ return ''; } }
function timeLabel(ts){ try{ return new Date(ts*1000).toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'}); }catch(e){ return ''; } }
function durLabel(sec){
  sec=Math.max(0,Math.round(sec));
  if(sec<60) return I18N.tf('status.dur.sec','{n}s',{n:sec});
  if(sec<3600) return I18N.tf('status.dur.min','{n}m',{n:Math.floor(sec/60)});
  if(sec<86400) return I18N.tf('status.dur.hour','{n}h {m}m',{n:Math.floor(sec/3600),m:Math.floor((sec%3600)/60)});
  return I18N.tf('status.dur.day','{n}d {h}h',{n:Math.floor(sec/86400),h:Math.floor((sec%86400)/3600)});
}
// Date-grouped incident list. `withLabel` shows the service name (cross-service feed).
function incidentFeed(box, incidents, withLabel){
  box.innerHTML='';
  if(!incidents.length){
    const e=document.createElement('div'); e.className='empty';
    e.textContent=I18N.t('status.incidents.none','No incidents recorded. Smooth sailing.');
    box.appendChild(e); return;
  }
  incidents.sort((a,b)=>b.start-a.start);
  let curDay=null, dayEl=null;
  incidents.forEach(i=>{
    const dl=dateLabel(i.start);
    if(dl!==curDay){
      curDay=dl;
      dayEl=document.createElement('div'); dayEl.className='day';
      const h=document.createElement('div'); h.className='dlabel'; h.textContent=dl; dayEl.appendChild(h);
      box.appendChild(dayEl);
    }
    const row=document.createElement('div'); row.className='row';
    const rl=document.createElement('div'); rl.className='rl';
    const dot=document.createElement('span'); dot.className='dot'+(i.end==null?' ongoing':''); rl.appendChild(dot);
    const reason=document.createElement('span'); reason.className='reason';
    // PRIVACY: only the generic reason ("Down") + optional HTTP code — never err.
    reason.textContent=(withLabel&&i.label?i.label+' · ':'')+I18N.t('status.incidents.down','Down');
    rl.appendChild(reason);
    if(i.code!=null){ const c=document.createElement('span'); c.className='code'; c.textContent='HTTP '+i.code; rl.appendChild(c); }
    if(i.end==null){ const o=document.createElement('span'); o.className='ongo'; o.textContent=' · '+I18N.t('status.incidents.ongoing','Ongoing'); rl.appendChild(o); }
    row.appendChild(rl);
    const meta=document.createElement('div');
    const when=document.createElement('span'); when.className='when';
    when.textContent=timeLabel(i.start)+(i.end!=null?'–'+timeLabel(i.end):'');
    const dur=document.createElement('span'); dur.className='dur'; dur.textContent=' · '+durLabel(i.duration_sec);
    meta.appendChild(when); meta.appendChild(dur);
    row.appendChild(meta);
    dayEl.appendChild(row);
  });
}

function kpi(v,suffix,label,cls){
  const el=document.createElement('div'); el.className='kpi '+(cls||'');

function tile(t){
  const el=document.createElement('div'); el.className='tile '+(t.status||'info');
  const name=I18N.t(TILE_NAME[t.key]||t.key, t.key);

  if(t.key==='containers' && t.total!=null) detail=I18N.tf('status.up_of','{up} / {total} up',{up:'<b>'+(t.up||0)+'</b>',total:t.total});
  else if(t.key==='services' && t.up!=null) detail='<b>'+t.up+'</b> '+I18N.t('status.metric.up','Up').toLowerCase();
  else if(t.key==='gpu') detail=t.busy?I18N.t('status.gpu.busy'):I18N.t('status.gpu.idle');

    (detail?'<div class="tdetail">'+detail+'</div>':'');

// State rank (0..3, -1=no data) → cell class + i18n state label.
const HB_CLS=['ok','warn','warn','crit'];
const HB_LBL=['status.state.ok','status.state.warn','status.state.warn','status.state.crit'];
function hbWhen(t){ return ago(Math.max(0,Math.floor(Date.now()/1000)-t)); }
function heartbeat(h){
  const wrap=document.createElement('div'); wrap.className='hb';
  const cells=h.cells||[]; const total=h.total||0;
  // a11y: the bar is decorative; the summary line carries the real text.
  const bar=document.createElement('div'); bar.className='bar'; bar.setAttribute('aria-hidden','true');
  cells.forEach(c=>{
    const d=document.createElement('span');
    const s=(c.s==null?-1:c.s);
    const klass = s<0 ? 'nodata' : HB_CLS[Math.max(0,Math.min(3,s))];
    d.className='cell '+klass;
    const lbl = s<0 ? I18N.t('status.hb.nodata','No data') : I18N.t(HB_LBL[Math.max(0,Math.min(3,s))]);
    d.title = lbl+' · '+hbWhen(c.t);
    bar.appendChild(d);
  });
  wrap.appendChild(bar);
  const sum=document.createElement('div'); sum.className='hbsum';
  if(total<=0){
    sum.classList.add('collecting');
    sum.textContent=I18N.t('status.hb.collecting','Collecting uptime history…');
    sum.setAttribute('role','status');
  }else{
    const up=h.up||0; const pct=(h.uptime!=null)?h.uptime:Math.round(1000*up/total)/10;
    const left=document.createElement('span'); left.innerHTML='<b>'+esc(pct)+'%</b> '+esc(I18N.t('status.hb.uptime','uptime'));
    const right=document.createElement('span'); right.textContent=I18N.tf('status.hb.upofm','{up} of {total} checks up',{up:up,total:total});
    sum.appendChild(left); sum.appendChild(right);
    // a11y summary for screen readers (not purely visual).
    sum.setAttribute('aria-label', I18N.tf('status.hb.a11y','{pct}% uptime, {up} of {total} checks up',{pct:pct,up:up,total:total}));
  }
  wrap.appendChild(sum);
  return wrap;
}
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ── Per-service detail page ── */
function dwin(val,labelKey){
  const el=document.createElement('div'); el.className='dwin';
  const v=document.createElement('div'); v.className='v'+(val==null?' na':'');
  v.textContent=(val==null)?'—':val+'%';

  el.appendChild(v); el.appendChild(l); return el;

// SVG latency sparkline from [{t,ms}] — no chart lib, mirrors the dashboard approach.
function sparkline(series){
  const box=document.createElement('div');
  if(!series||series.length<2){
    const n=document.createElement('div'); n.className='sparknote';
    n.textContent=I18N.t('status.detail.nolat','Not enough response-time data yet.');
    box.appendChild(n); return box;
  }
  const W=600,H=72,pad=4;
  const xs=series.map(p=>p.t), ys=series.map(p=>p.ms);
  const x0=Math.min(...xs), x1=Math.max(...xs);
  const y0=0, y1=Math.max(...ys,1);
  const sx=t=>(x1===x0)?W/2:pad+(t-x0)/(x1-x0)*(W-2*pad);
  const sy=v=>H-pad-(v-y0)/(y1-y0)*(H-2*pad);
  let line='', area='M '+sx(xs[0]).toFixed(1)+' '+(H-pad);
  series.forEach((p,i)=>{ const X=sx(p.t).toFixed(1),Y=sy(p.ms).toFixed(1); line+=(i?' L ':'M ')+X+' '+Y; area+=' L '+X+' '+Y; });
  area+=' L '+sx(xs[xs.length-1]).toFixed(1)+' '+(H-pad)+' Z';
  const avg=Math.round(ys.reduce((a,b)=>a+b,0)/ys.length);
  const svg='<svg class="spark" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" aria-label="'+
    esc(I18N.tf('status.detail.lata11y','Response time, average {n} ms, peak {p} ms',{n:avg,p:Math.round(y1)}))+'">'+
    '<path class="ar" d="'+area+'"/><path class="ln" d="'+line+'"/></svg>';
  box.innerHTML=svg;
  const cap=document.createElement('div'); cap.className='hb hbsum'; cap.style.marginTop='9px';
  const a=document.createElement('span'); a.innerHTML='<b>'+esc(avg)+'</b> '+esc(I18N.t('status.detail.avgms','ms avg'));
  const b=document.createElement('span'); b.textContent=I18N.tf('status.detail.peakms','{n} ms peak',{n:Math.round(y1)});
  cap.appendChild(a); cap.appendChild(b); box.appendChild(cap);
  return box;
}

let detailId=null, detailData=null;

  rb.hidden=false; rb.innerHTML='';
  const head=document.createElement('div'); head.className='rbhead';
  const left=document.createElement('div'); left.className='rbpct';
  if(w['90d']!=null) left.innerHTML=esc(w['90d'])+'% <small>'+esc(I18N.tf('status.ribbon.over','uptime over the last {n} days',{n:d.span||90}))+'</small>';
  else { left.className='rbnote'; left.textContent=I18N.t('status.ribbon.collecting','Collecting daily uptime history…'); }
  head.appendChild(left); rb.appendChild(head);
  const bar=dailyBar(d.daily||[]); bar.className='rbbar'; bar.style.height='34px'; rb.appendChild(bar);
  const axis=document.createElement('div'); axis.className='rbaxis';
  const ax=document.createElement('span'); ax.textContent=I18N.tf('status.ribbon.daysago','{n} days ago',{n:d.span||90});
  const bx=document.createElement('span'); bx.textContent=I18N.t('status.ribbon.today','Today');
  axis.appendChild(ax); axis.appendChild(bx); rb.appendChild(axis);
  // SLA / downtime summary + RSS subscribe link
  renderSla(d.sla);
  const rss=document.getElementById('dRss');
  if(rss){ if(d.id){ rss.href='/status/'+encodeURIComponent(d.id)+'/feed.xml'; rss.hidden=false; } else { rss.hidden=true; } }
  // latency sparkline
  const sp=document.getElementById('dSpark'); sp.innerHTML=''; sp.appendChild(sparkline(d.response_series||[]));
  // per-service incidents
  incidentFeed(document.getElementById('dInc'), d.incidents||[], false);
  document.title=(d.label?d.label+' · ':'')+'Lab status · HomeLab Monitor';
}

/* ── Client-side routing (/status ↔ /status/<id>) ── */
function currentId(){ const m=location.pathname.match(/^\/status\/([^\/?#]+)/); return m?decodeURIComponent(m[1]):null; }
function showView(detail){
  document.getElementById('indexView').hidden=detail;
  document.getElementById('detailView').hidden=!detail;
}
function navTo(path){ history.pushState({},'',path); route(); }
function route(){
  const id=currentId();
  if(id){ showView(true); loadDetail(id); }
  else{ showView(false); detailId=null; load(); document.title='Lab status · HomeLab Monitor'; }
}
window.addEventListener('popstate',route);

/* ── Fetch + auto-refresh ── */
let timer=null;
async function load(){
  if(currentId()) return;   // detail view owns the fetch loop while open
  try{
    const r=await fetch('/api/status',{cache:'no-cache'});
    if(!r.ok) throw new Error('http '+r.status);
    render(await r.json());
  }catch(e){
    document.body.classList.add('offline-state');
  }
}
/* tick the "last updated" label every second without re-fetching */
setInterval(()=>{
  if(currentId()||!lastData) return;
  const u=document.getElementById('updatedLine'); if(!u) return;
  const age=Math.max(0, Math.floor(Date.now()/1000) - (lastData.updated||0));
  u.textContent=I18N.tf('status.updated','Last updated {ago}',{ago:ago(age)});
},1000);

function refresh(){ if(currentId()){ if(detailId) loadDetail(detailId); } else load(); }

document.getElementById('backLink').addEventListener('click',ev=>{
  if(ev.metaKey||ev.ctrlKey||ev.shiftKey||ev.button) return; ev.preventDefault(); navTo('/status');
});

(async()=>{
  await I18N.init();
  route();
  timer=setInterval(refresh, 20000);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) refresh(); });
})();
</script>
</body></html>
